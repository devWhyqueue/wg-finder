[project]
name = "wgfinder"
version = "0.3"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yannik Queisler", email = "dev.yannik.queisler@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "click>=8.1.7,<9",
    "requests>=2.32,<3",
    "openai>=1.40,<2",
    "pywhatkit==5.4",
    "Flask>=3.0.0,<4",
    "backoff>=2.2.1,<3",
    "python-dotenv>=1.1.1,<2",
]

[project.scripts]
wgfinder = "wgfinder.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wgfinder*"]

[tool.setuptools.package-data]
wgfinder = ["config/*.ini", "templates/*.txt"]
