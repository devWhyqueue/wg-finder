[project]
name = "wgfinder"
version = "0.3"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yannik Queisler", email = "dev.yannik.queisler@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.14.3,<5",
    "click>=8.3.2,<9",
    "requests>=2.32.5,<3",
    "openai>=2.30.0,<3",
    "Flask>=3.1.3,<4",
    "backoff>=2.2.1,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.scripts]
wgfinder = "wgfinder.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pyright>=1.1.408",
    "pysonar>=1.4.0.4676",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6.0.3",
    "ruff>=0.15.9,<1",
    "truststore>=0.10.4",
    "vulture>=2.16,<3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgfinder"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/wgfinder",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/pyrightconfig.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-s"
