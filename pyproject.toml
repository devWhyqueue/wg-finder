[project]
name = "wgfinder"
version = "0.3"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yannik Queisler", email = "dev.yannik.queisler@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "click>=8.1.7,<9",
    "requests>=2.32,<3",
    "openai>=1.40,<2",
    "Flask>=3.0.0,<4",
    "backoff>=2.2.1,<3",
    "python-dotenv>=1.1.1,<2",
]

[project.scripts]
wgfinder = "wgfinder.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "click>=8.3.1",
    "pyright>=1.1.408",
    "pysonar>=1.3.0.4086",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
    "truststore>=0.10.4",
    "vulture>=2.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wgfinder*"]

[tool.setuptools.package-data]
wgfinder = ["config/*.ini", "templates/*.txt"]

[tool.pytest.ini_options]
addopts = "-s"
